<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>我和狗蛋儿的家 · 世界入口</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.tokens.css?v=20260731-ui-refresh-r4" />
    <link rel="stylesheet" href="./styles.creative.css?v=20260905-push-client" />
    <link rel="stylesheet" href="./styles.world-entry.css?v=20260731-ui-refresh-r4" />
    <script>
      (function() {
        const applyTimeOfDay = function() {
          const hour = new Date().getHours();
          if (document.body) {
            document.body.dataset.timeOfDay = (hour >= 6 && hour < 18) ? "day" : "night";
          }
        };
        if (document.body) {
          applyTimeOfDay();
        } else {
          document.addEventListener("DOMContentLoaded", applyTimeOfDay, { once: true });
        }
        document.addEventListener("DOMContentLoaded", function() {
          var deviceId = new URLSearchParams(window.location.search).get("device_id");
          if (deviceId) {
            var input = document.getElementById("auth-device-input");
            if (input) input.value = deviceId;
          }
        }, { once: true });
      })();
    </script>
  </head>
  <body
    data-shell-page="world-entry"
    data-shell-variant="metro-station"
    data-default-shell-mode="unified"
    data-workspace="chat"
    data-resident-login="enabled"
    data-sfc-theme="city"
  >
    <div id="resident-login-overlay" class="resident-login-overlay shell-hidden" aria-hidden="true">
      <section id="resident-login-card" class="resident-login-card" aria-label="居民登录">
        <button type="button" id="resident-login-close" class="resident-login-close" aria-label="关闭登录窗口">×</button>
        <div class="resident-login-copy">
          <span class="resident-login-kicker">居民身份</span>
          <strong id="auth-status">登录状态：访客模式</strong>
        </div>
        <form id="auth-request-form" class="resident-login-form" data-auth-step="request">
          <label for="auth-email-input" class="resident-login-field-label">邮箱地址（也是你的注册ID）</label>
          <input id="auth-email-input" type="email" placeholder="输入邮箱地址" autocomplete="email" required />
          <label for="auth-nickname-input" class="resident-login-field-label">用户昵称</label>
          <input id="auth-nickname-input" type="text" placeholder="输入用户昵称" autocomplete="nickname" />
          <input id="auth-resident-input" type="hidden" autocomplete="off" />
          <input id="auth-device-input" type="hidden" autocomplete="off" />
          <input id="auth-delivery-select" type="hidden" value="email" />
          <button id="auth-request-button" type="submit">获取验证码</button>
        </form>
        <form id="auth-verify-form" class="resident-login-form resident-login-verify shell-hidden" data-auth-step="verify">
          <input id="auth-challenge-input" type="hidden" autocomplete="off" />
          <label for="auth-code-input" class="resident-login-field-label">邮箱验证码</label>
          <input id="auth-code-input" type="text" placeholder="输入邮箱验证码" autocomplete="one-time-code" />
          <button id="auth-verify-button" type="submit">完成登录</button>
        </form>
      </section>
    </div>

    <div class="app app-hub-shell sfc-shell sfc-city-shell world-entry-shell">
      <header class="sfc-hud world-entry-hud">
        <div class="hud-left">
          <div class="world-entry-hud-copy">
            <span class="hud-kicker">World Gate</span>
            <span class="hud-title">世界入口</span>
          </div>
        </div>
        <div class="hud-right">
          <button type="button" id="hud-login-toggle" class="hud-login-toggle shell-hidden" aria-label="打开登录窗口">登录</button>
          <span class="world-entry-hud-chip">地铁候车站</span>
          <span id="hud-status" class="hud-pill">待机</span>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换亮色/暗色模式" title="切换亮色/暗色模式">☀️</button>
        </div>
      </header>

      <main class="sfc-layout world-entry-layout" aria-label="世界入口">
        <aside class="sfc-rail world-entry-rail" data-shell-column="rooms">
          <div class="rail-actions">
            <a href="./creative.html" class="rail-item">
              <span class="rail-item-label">住宅</span>
            </a>
            <a href="./index.html" class="rail-item">
              <span class="rail-item-label">主城</span>
            </a>
            <a href="./unified.html" class="rail-item is-active" aria-current="page">
              <span class="rail-item-label">世界入口</span>
            </a>
          </div>
        </aside>

        <section class="sfc-stage world-entry-stage" aria-label="世界入口地铁候车站">
          <div class="world-entry-scene" aria-hidden="true"></div>

          <div class="scene-hotspots world-entry-hotspots" aria-label="世界入口热点">
            <a href="./index.html" class="scene-hotspot world-entry-hotspot--city" data-hotspot-title="返回主城" data-hotspot-copy="回到主城广场。">
              <span>返回主城</span>
            </a>
            <button type="button" class="scene-hotspot world-entry-hotspot--platform" data-hotspot-title="候车站台" data-hotspot-copy="这里是世界线路的等待区，后续承载外部城邦状态。">
              <span>候车站台</span>
            </button>
            <button type="button" class="scene-hotspot world-entry-hotspot--train" data-hotspot-title="列车通道" data-hotspot-copy="列车与隧道会连接到外部世界和互联城邦。">
              <span>列车通道</span>
            </button>
            <a href="#world-routes" class="scene-hotspot world-entry-hotspot--map" data-hotspot-title="世界线路图" data-hotspot-copy="选择要前往的其他主城。">
              <span>世界线路图</span>
            </a>
          </div>

          <div id="world-routes" class="world-route-panel" aria-label="世界线路选择">
            <div class="world-route-card">
              <a class="world-route-close" href="./unified.html" aria-label="关闭世界线路选择">关闭</a>
              <p class="world-route-kicker">世界线路图</p>
              <h2>选择前往的主城</h2>
              <div class="world-route-list">
                <a href="./world-square.html" class="world-route-option world-route-option-square">
                  <strong>世界广场</strong>
                  <span>打开之前绘制的世界广场完整素材，作为公共广场入口。</span>
                  <span class="world-route-status">概念图 · 公共广场</span>
                </a>
                <a href="./index.html" class="world-route-option">
                  <strong>凛冬城主城</strong>
                  <span>当前主城广场，群聊与公告入口。</span>
                </a>
                <a href="./index.html?city=harbor" class="world-route-option">
                  <strong>海港主城</strong>
                  <span>后续外城入口，暂接入同一主城壳。</span>
                </a>
                <a href="./index.html?city=mountain" class="world-route-option">
                  <strong>山城主城</strong>
                  <span>预留线路，用于后续多城邦扩展。</span>
                </a>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js?v=20260905-push-client"></script>
  </body>
</html>
