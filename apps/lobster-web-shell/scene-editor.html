<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我和狗蛋儿的家 · 场景编辑器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles.tokens.css?v=20260731-ui-refresh-r4">
<link rel="stylesheet" href="./styles.css?v=20260731-ui-refresh-r4">
<link rel="stylesheet" href="./styles.pixel-map.css?v=20260802-scene-canvas-cqh">
<style>
:root { --editor-bg: #0d0a08; --editor-panel: #1a1410; --editor-accent: #f1c978; --editor-text: #e8dcc8; }
body { margin:0; background:var(--editor-bg); color:var(--editor-text); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
.editor-shell { display:grid; grid-template-columns:280px 1fr; height:100vh; }
.editor-sidebar { background:var(--editor-panel); padding:16px; overflow-y:auto; border-right:2px solid rgba(241,201,120,0.2); }
.editor-sidebar h2 { color:var(--editor-accent); font-size:16px; margin:0 0 12px; }
.editor-sidebar label { display:block; font-size:12px; color:#999; margin:8px 0 4px; }
.editor-sidebar input, .editor-sidebar select { width:100%; padding:8px; background:#1a1410; border:1px solid rgba(241,201,120,0.3); color:var(--editor-text); border-radius:6px; font-size:13px; box-sizing:border-box; }
.editor-sidebar button { width:100%; padding:10px; margin-top:12px; background:var(--editor-accent); color:#1a1410; border:0; border-radius:6px; font-weight:700; cursor:pointer; font-size:13px; }
.editor-sidebar button.secondary { background:rgba(241,201,120,0.15); color:var(--editor-accent); }
.editor-sidebar button.danger { background:rgba(255,80,80,0.15); color:#ff6060; }
.editor-sidebar .prop-group { margin-top:12px; padding-top:12px; border-top:1px solid rgba(241,201,120,0.1); }
.editor-sidebar .prop-row { display:flex; gap:8px; }
.editor-sidebar .prop-row > * { flex:1; }
.editor-stage { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; touch-action: none; }
/* 所有背景与热点共享此 16:9 逻辑画布；stage 只负责居中和容纳，不参与百分比坐标计算。 */
.scene-canvas { position:relative; flex:0 0 auto; width:min(100%, calc(100vh * 16 / 9)); max-width:100%; max-height:100%; aspect-ratio:16 / 9; transform-origin:center; overflow:visible; }
.scene-canvas img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
.editor-hotspot { position:absolute; border:2px dashed rgba(241,201,120,0.5); background:rgba(241,201,120,0.1); cursor:move; display:flex; align-items:center; justify-content:center; min-width:40px; min-height:24px; touch-action:none; }
.editor-hotspot:hover { border-color:var(--editor-accent); background:rgba(241,201,120,0.2); }
.editor-hotspot.selected { border:2px solid var(--editor-accent); background:rgba(241,201,120,0.25); box-shadow:0 0 0 2px rgba(241,201,120,0.15); }
.editor-hotspot-label { position:absolute; top:-20px; left:50%; transform:translateX(-50%); background:#1a1410; color:var(--editor-accent); padding:2px 8px; border-radius:4px; font-size:11px; white-space:nowrap; pointer-events:none; }
/* Resize handles */
.editor-resize-handle { position:absolute; width:10px; height:10px; background:var(--editor-accent); border:1px solid #1a1410; border-radius:2px; z-index:2; }
/* 触控热区扩展：视觉保持 10px 方块，::before 把可点区域扩到 24px（移动端捏取友好，pointer 事件落在伪元素上等价于落在手柄上）。 */
.editor-resize-handle::before { content:''; position:absolute; inset:-7px; }
.editor-resize-handle--nw { top:-6px; left:-6px; cursor:nw-resize; }
.editor-resize-handle--ne { top:-6px; right:-6px; cursor:ne-resize; }
.editor-resize-handle--sw { bottom:-6px; left:-6px; cursor:sw-resize; }
.editor-resize-handle--se { bottom:-6px; right:-6px; cursor:se-resize; }
/* Hotspot delete button */
.editor-hotspot-delete { position:absolute; top:-32px; right:-6px; width:28px; height:28px; background:rgba(255,60,60,0.85); color:#fff; border:none; border-radius:50%; font-size:14px; line-height:28px; text-align:center; cursor:pointer; z-index:3; opacity:0; transition:opacity 0.15s; padding:0; }
.editor-hotspot.selected .editor-hotspot-delete { opacity:1; }
.editor-hotspot-delete:hover { background:#ff3030; }
.editor-toolbar { position:absolute; top:12px; right:12px; z-index:10; display:flex; gap:8px; }
.editor-toolbar button { padding:8px 16px; background:var(--editor-panel); color:var(--editor-accent); border:1px solid rgba(241,201,120,0.3); border-radius:6px; cursor:pointer; font-size:12px; }
.editor-toolbar button:hover { background:rgba(241,201,120,0.15); }
.editor-status { position:absolute; bottom:12px; left:12px; font-size:11px; color:#888; }
/* 热点列表：侧栏内多热点管理，点击选中、× 删除，弥补只能舞台点击选中的缺口。 */
.hotspot-list-wrap { margin-top:12px; padding-top:12px; border-top:1px solid rgba(241,201,120,0.1); }
.hotspot-list-wrap > label { display:block; font-size:12px; color:#999; margin-bottom:6px; }
.editor-hotspot-list { list-style:none; margin:0; padding:0; max-height:200px; overflow-y:auto; }
.editor-hotspot-list li { display:flex; align-items:center; gap:6px; padding:6px 8px; margin-bottom:4px; background:rgba(241,201,120,0.05); border:1px solid rgba(241,201,120,0.15); border-radius:6px; cursor:pointer; font-size:12px; }
.editor-hotspot-list li:hover { background:rgba(241,201,120,0.12); }
.editor-hotspot-list li.selected { border-color:var(--editor-accent); background:rgba(241,201,120,0.18); }
.editor-hotspot-list li .hl-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.editor-hotspot-list li .hl-del { width:18px; height:18px; background:rgba(255,80,80,0.15); color:#ff6060; border:0; border-radius:50%; font-size:11px; line-height:18px; text-align:center; cursor:pointer; padding:0; flex:none; }
.editor-hotspot-list li .hl-del:hover { background:#ff3030; color:#fff; }
.editor-hotspot-list .hl-empty { color:#666; font-size:11px; padding:8px; text-align:center; cursor:default; }
.editor-hotspot-list .hl-empty:hover { background:transparent; }
/* 移动端：侧栏置顶限高滚动，舞台占满剩余高度，避免 280px 桌面侧栏在窄屏挤爆舞台。 */
@media (max-width: 768px) {
  .editor-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .editor-sidebar { border-right: none; border-bottom: 2px solid rgba(241,201,120,0.2); max-height: 42vh; }
}
/* 空状态引导：img 无 src 时居中提示，加载/预览设了 src 后自动隐藏（CSS :has，无需 JS） */
.editor-empty-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#666; font-size:13px; pointer-events:none; padding:0 24px; }
.editor-empty-hint p { margin:4px 0; }
.editor-empty-hint p:first-child { font-size:20px; color:var(--editor-accent); }
.editor-stage:has(#sceneImage[src]:not([src=""])) .editor-empty-hint { display:none; }
</style>
</head>
<body>
<div class="editor-shell">
  <aside class="editor-sidebar">
    <h2>🖼️ 场景编辑器</h2>
    <label>房间 ID</label>
    <input id="roomId" placeholder="dm:yourname:friendname" />
    <label>白天背景 URL</label>
    <input id="dayUrl" placeholder="https://... 白天像素图" />
    <label>夜晚背景 URL</label>
    <input id="nightUrl" placeholder="https://... 夜晚像素图" />
    <label>Gateway</label>
    <input id="gatewayUrl" placeholder="http://127.0.0.1:8787" value="" />
    <label>Session Token</label>
    <input id="sessionToken" placeholder="lbst_..." />
    <hr style="border-color:rgba(241,201,120,0.1);margin:12px 0;" />
    <button id="loadBtn">📥 加载当前场景</button>
    <button id="addHotspotBtn" class="secondary">➕ 添加热点</button>
    <button id="saveBtn">💾 保存场景</button>
    <div style="margin-top:8px;display:flex;gap:8px;">
      <button id="previewBtn" class="secondary" style="flex:1;">👁 预览昼夜</button>
      <button id="resetBtn" class="danger" style="flex:1;">↩ 重置</button>
    </div>
    <div id="hotspot-props" class="prop-group" style="display:none;">
      <label style="font-weight:600;color:var(--editor-accent);margin-bottom:8px;">🎯 热点属性</label>
      <label>标签名</label>
      <input id="prop-label" placeholder="热点名称" />
      <label>交互提示</label>
      <input id="prop-hint" placeholder="鼠标悬停时显示的说明" />
      <div class="prop-row">
        <div><label>X%</label><input id="prop-x" type="number" min="0" max="100" step="0.5" /></div>
        <div><label>Y%</label><input id="prop-y" type="number" min="0" max="100" step="0.5" /></div>
      </div>
      <div class="prop-row">
        <div><label>宽%</label><input id="prop-w" type="number" min="1" max="100" step="0.5" /></div>
        <div><label>高%</label><input id="prop-h" type="number" min="1" max="100" step="0.5" /></div>
      </div>
    </div>
    <div class="hotspot-list-wrap">
      <label>📋 热点列表（<span id="hotspot-count">0</span>）</label>
      <ul id="hotspot-list" class="editor-hotspot-list"></ul>
    </div>
    <div id="status" style="margin-top:12px;font-size:11px;color:#888;"></div>
  </aside>
  <div class="editor-stage" id="stage">
    <div class="editor-empty-hint" id="emptyHint">
      <p>🏗️ 场景编辑器</p>
      <p>填入白天/夜晚背景 URL，或加载当前房间场景后开始编辑热点</p>
    </div>
    <div class="scene-canvas" id="sceneCanvas">
      <img id="sceneImage" src="" alt="场景预览" style="display:none;" />
    </div>
    <div class="editor-toolbar">
      <button id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
      <button id="redoBtn" title="重做 (Ctrl+Y)">↷ 重做</button>
      <button id="zoomIn">🔍+</button>
      <button id="zoomOut">🔍-</button>
      <button id="fitBtn">📐 适应</button>
    </div>
    <div class="editor-status" id="coordDisplay">坐标: -</div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const sceneCanvas = $('sceneCanvas');
const img = $('sceneImage');
const statusEl = $('status');
const coordEl = $('coordDisplay');
const props = $('hotspot-props');

// State
let hotspots = [];
let selectedHotspot = null;
let isDragging = false;
let isResizing = false;
let resizeCorner = null;
let dragOffset = { x: 0, y: 0 };
let resizeStart = { x: 0, y: 0, w: 0, h: 0 };
let scale = 1;
// 方向键微调的历史合并：连续按住方向键只在首次（或间隔 600ms 后）推一次 undo 快照。
let lastNudgeAt = 0;
// 未保存追踪：用快照比较捕获任意热点/背景改动，加载/保存成功置基线；页面卸载时有改动则警告防丢失。
let lastSavedSnapshot = null;
function sceneSnapshot() {
  return JSON.stringify({ hotspots: hotspots, day: $('dayUrl').value.trim(), night: $('nightUrl').value.trim() });
}
function markClean() { lastSavedSnapshot = sceneSnapshot(); }
function isDirty() { return lastSavedSnapshot !== null && sceneSnapshot() !== lastSavedSnapshot; }
window.addEventListener('beforeunload', function(e) { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

// undo/redo：结构变更（增删/拖拽/缩放/重置）前 push 快照，Ctrl+Z/Y 或工具栏按钮恢复；属性 input 不记录（太频繁）。
let undoStack = [];
let redoStack = [];
let preDragSnapshot = null;
const MAX_HISTORY = 50;
function pushHistory(snap) {
  undoStack.push(snap || sceneSnapshot());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
}
function restoreSnapshot(snap) {
  var state = JSON.parse(snap);
  hotspots = state.hotspots || [];
  $('dayUrl').value = state.day || '';
  $('nightUrl').value = state.night || '';
  var bg = document.body.dataset.timeOfDay === 'day' ? (state.day || '') : (state.night || '');
  if (bg) { img.src = bg; img.style.display = 'block'; } else { img.removeAttribute('src'); img.style.display = 'none'; }
  selectedHotspot = null;
  props.style.display = 'none';
  renderHotspots();
}
function undo() {
  if (!undoStack.length) return status('没有可撤销的操作', true);
  redoStack.push(sceneSnapshot());
  restoreSnapshot(undoStack.pop());
  status('已撤销', false);
}
function redo() {
  if (!redoStack.length) return status('没有可重做的操作', true);
  undoStack.push(sceneSnapshot());
  restoreSnapshot(redoStack.pop());
  status('已重做', false);
}

// Parse URL params
const params = new URLSearchParams(location.search);
$('roomId').value = params.get('room') || params.get('room_id') || '';
$('gatewayUrl').value = params.get('gateway') || 'http://127.0.0.1:8787';
$('sessionToken').value = params.get('token') || localStorage.getItem('lobster-session-token') || '';

function sceneActor() {
  return (params.get('identity') || localStorage.getItem('lobster-identity') || '').trim();
}

function status(msg, isError) { statusEl.textContent = msg; statusEl.style.color = isError ? '#ff6060' : '#888'; }

async function api(path, method, body) {
  const gw = $('gatewayUrl').value.trim().replace(/\/+$/, '');
  if (!gw) throw new Error('未配置 Gateway 地址');
  const token = $('sessionToken').value.trim();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(gw + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  // 统一检查 HTTP 状态码：非 2xx 抛带状态码的错误，让加载/保存的 catch 给出准确反馈，
  // 不再依赖响应体里可能缺失的 error 字段（401/403/404/500 一律走异常路径）。
  var data = null;
  try { data = await res.json(); } catch (_) { /* 非 JSON 响应体（如纯文本错误页） */ }
  if (!res.ok) {
    var msg = (data && (data.error || data.message)) || ('HTTP ' + res.status);
    var err = new Error(msg); err.status = res.status; throw err;
  }
  return data;
}

function selectHotspot(i) {
  selectedHotspot = i;
  document.querySelectorAll('.editor-hotspot').forEach(function(el) { el.classList.remove('selected'); });
  var el = document.querySelector('.editor-hotspot[data-index="' + i + '"]');
  if (el) el.classList.add('selected');
  updatePropsPanel();
}

function updatePropsPanel() {
  if (selectedHotspot == null || !hotspots[selectedHotspot]) {
    props.style.display = 'none';
    return;
  }
  props.style.display = 'block';
  var h = hotspots[selectedHotspot];
  $('prop-label').value = h.label || '';
  $('prop-hint').value = h.interaction_hint || '';
  $('prop-x').value = Math.round(h.x_permyriad / 100 * 10) / 10;
  $('prop-y').value = Math.round(h.y_permyriad / 100 * 10) / 10;
  $('prop-w').value = Math.round(h.width_permyriad / 100 * 10) / 10;
  $('prop-h').value = Math.round(h.height_permyriad / 100 * 10) / 10;
  coordEl.textContent = '热点 #' + (selectedHotspot + 1) + ' — ' + (h.label || '未命名');
}

function applyPropChanges() {
  if (selectedHotspot == null || !hotspots[selectedHotspot]) return;
  var h = hotspots[selectedHotspot];
  h.label = $('prop-label').value.trim() || ('热点' + (selectedHotspot + 1));
  h.interaction_hint = $('prop-hint').value.trim();
  h.x_permyriad = Math.round(parseFloat($('prop-x').value || 0) * 100);
  h.y_permyriad = Math.round(parseFloat($('prop-y').value || 0) * 100);
  h.width_permyriad = Math.round(parseFloat($('prop-w').value || 8) * 100);
  h.height_permyriad = Math.round(parseFloat($('prop-h').value || 6) * 100);
  renderHotspots();
}

// Bind property inputs to update model
['label','hint','x','y','w','h'].forEach(function(key) {
  var el = $('prop-' + key);
  if (el) el.addEventListener('input', applyPropChanges);
});

// Render hotspots
function makeHandle(corner) {
  var handle = document.createElement('div');
  handle.className = 'editor-resize-handle editor-resize-handle--' + corner;
  handle.addEventListener('pointerdown', function(e) {
    e.stopPropagation();
    e.preventDefault();
    if (selectedHotspot == null) return;
    isResizing = true;
    preDragSnapshot = sceneSnapshot();
    resizeCorner = corner;
    var h = hotspots[selectedHotspot];
    resizeStart = { x: h.x_permyriad, y: h.y_permyriad, w: h.width_permyriad, h: h.height_permyriad };
  });
  return handle;
}

function makeDeleteBtn(i) {
  var btn = document.createElement('button');
  btn.className = 'editor-hotspot-delete';
  btn.textContent = '×';
  btn.title = '删除此热点';
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    pushHistory();
    hotspots.splice(i, 1);
    if (selectedHotspot === i) { selectedHotspot = null; props.style.display = 'none'; }
    else if (selectedHotspot > i) selectedHotspot--;
    renderHotspots();
    status('热点已删除', false);
  });
  return btn;
}

function renderHotspots() {
  document.querySelectorAll('.editor-hotspot').forEach(function(el) { el.remove(); });
  hotspots.forEach(function(h, i) {
    var el = document.createElement('div');
    el.className = 'editor-hotspot';
    el.style.left = (h.x_permyriad / 100) + '%';
    el.style.top = (h.y_permyriad / 100) + '%';
    el.style.width = (h.width_permyriad / 100) + '%';
    el.style.height = (h.height_permyriad / 100) + '%';
    el.dataset.index = i;

    var label = document.createElement('span');
    label.className = 'editor-hotspot-label';
    label.textContent = h.label || ('热点' + (i + 1));
    el.appendChild(label);

    // Resize handles (4 corners)
    el.appendChild(makeHandle('nw'));
    el.appendChild(makeHandle('ne'));
    el.appendChild(makeHandle('sw'));
    el.appendChild(makeHandle('se'));

    // Delete button
    el.appendChild(makeDeleteBtn(i));

    // Drag
    el.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.editor-resize-handle, .editor-hotspot-delete')) return;
      e.preventDefault();
      isDragging = true;
      preDragSnapshot = sceneSnapshot();
      selectedHotspot = i;
      var rect = sceneCanvas.getBoundingClientRect();
      dragOffset.x = e.clientX - rect.left - (h.x_permyriad / 100) * rect.width;
      dragOffset.y = e.clientY - rect.top - (h.y_permyriad / 100) * rect.height;
      renderHotspots();
      updatePropsPanel();
    });
    el.addEventListener('click', function(e) { e.stopPropagation(); selectHotspot(i); });
    sceneCanvas.appendChild(el);

    if (selectedHotspot === i) el.classList.add('selected');
  });
  if (selectedHotspot != null) updatePropsPanel();
  renderHotspotList();
}

// 热点列表：侧栏多热点管理，点击选中、× 删除（弥补只能舞台点击选中的缺口）
function renderHotspotList() {
  var ul = $('hotspot-list');
  var countEl = $('hotspot-count');
  if (!ul) return;
  if (countEl) countEl.textContent = hotspots.length;
  ul.innerHTML = '';
  if (!hotspots.length) {
    var empty = document.createElement('li');
    empty.className = 'hl-empty';
    empty.textContent = '暂无热点，点「添加热点」开始';
    ul.appendChild(empty);
    return;
  }
  hotspots.forEach(function(h, i) {
    var li = document.createElement('li');
    if (selectedHotspot === i) li.classList.add('selected');
    var label = document.createElement('span');
    label.className = 'hl-label';
    label.textContent = (i + 1) + '. ' + (h.label || ('热点' + (i + 1)));
    li.appendChild(label);
    li.addEventListener('click', function(e) { if (e.target.classList.contains('hl-del')) return; selectHotspot(i); renderHotspotList(); });
    var del = document.createElement('button');
    del.className = 'hl-del';
    del.textContent = '×';
    del.title = '删除此热点';
    del.addEventListener('click', function(e) { e.stopPropagation(); pushHistory(); hotspots.splice(i, 1); if (selectedHotspot === i) { selectedHotspot = null; props.style.display = 'none'; } else if (selectedHotspot > i) selectedHotspot--; renderHotspots(); status('热点已删除', false); });
    li.appendChild(del);
    ul.appendChild(li);
  });
}

// Load — 抽成函数，供 loadBtn 与页面自动加载复用
async function loadCurrentScene() {
  var room = $('roomId').value.trim();
  if (!room) return status('请输入房间 ID', true);
  var btn = $('loadBtn'); var orig = btn.textContent;
  btn.disabled = true; btn.textContent = '📥 加载中...';
  status('加载中...');
  try {
    var stateQuery = new URLSearchParams({ room_id: room });
    var actor = sceneActor();
    if (actor && actor !== '访客') stateQuery.set('resident_id', actor);
    var data = await api('/v1/shell/state?' + stateQuery.toString(), 'GET');
    var rooms = [];
    for (var candidate of [data?.rooms, data?.scene_render?.scenes, data?.conversation_state?.rooms, data?.conversation_shell?.conversations]) {
      if (Array.isArray(candidate)) rooms = rooms.concat(candidate);
    }
    var found = rooms.find(function(r) { return r.id === room || r.conversation_id === room; });
    if (found) {
      var imageLayer = found.image_layer || null;
      $('dayUrl').value = imageLayer?.day_image_url || '';
      $('nightUrl').value = imageLayer?.night_image_url || '';
      var bg = document.body.dataset.timeOfDay === 'day' ? $('dayUrl').value : $('nightUrl').value;
      if (bg) { img.src = bg; img.style.display = 'block'; }
      else { img.removeAttribute('src'); img.style.display = 'none'; }
      hotspots = JSON.parse(JSON.stringify(found.hotspot_layer?.hotspots || []));
      selectedHotspot = null;
      renderHotspots();
      status('已加载', false);
    } else {
      $('dayUrl').value = '';
      $('nightUrl').value = '';
      img.removeAttribute('src'); img.style.display = 'none';
      hotspots = [];
      selectedHotspot = null;
      renderHotspots();
      status('未找到房间场景数据，将创建新场景', false);
    }
    markClean(); // 加载完成（无论找到与否），当前状态作为干净基线
  } catch (e) {
    status('加载失败: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
$('loadBtn').onclick = loadCurrentScene;

// Add hotspot
$('addHotspotBtn').onclick = function() {
  pushHistory();
  hotspots.push({ hotspot_id: 'h-' + Date.now(), label: '热点' + (hotspots.length + 1), interaction_hint: "", sprite_hint: "default", x_permyriad: 2500, y_permyriad: 2500, width_permyriad: 800, height_permyriad: 600 });
  selectedHotspot = hotspots.length - 1;
  renderHotspots();
  status('已添加热点 ' + hotspots.length, false);
};

// Drag (move) — global
document.addEventListener('pointermove', function(e) {
  if (!isDragging || selectedHotspot == null) return;
  var rect = sceneCanvas.getBoundingClientRect();
  var h = hotspots[selectedHotspot];
  var nx = Math.max(0, Math.min(10000 - h.width_permyriad, ((e.clientX - rect.left - dragOffset.x) / rect.width * 10000)));
  var ny = Math.max(0, Math.min(10000 - h.height_permyriad, ((e.clientY - rect.top - dragOffset.y) / rect.height * 10000)));
  h.x_permyriad = Math.round(nx);
  h.y_permyriad = Math.round(ny);
  renderHotspots();
  coordEl.textContent = '移动: ' + Math.round(nx / 100) + '%, ' + Math.round(ny / 100) + '%';
});

// Resize — global
document.addEventListener('pointermove', function(e) {
  if (!isResizing || selectedHotspot == null || !resizeCorner) return;
  var rect = sceneCanvas.getBoundingClientRect();
  var h = hotspots[selectedHotspot];
  var mx = (e.clientX - rect.left) / rect.width * 10000;
  var my = (e.clientY - rect.top) / rect.height * 10000;
  var sx = resizeStart.x, sy = resizeStart.y, sw = resizeStart.w, sh = resizeStart.h;
  var corner = resizeCorner;
  var newX = sx, newY = sy, newW = sw, newH = sh;

  if (corner === 'nw') {
    newX = Math.max(0, Math.min(sx + sw - 100, mx));
    newY = Math.max(0, Math.min(sy + sh - 100, my));
    newW = sx + sw - newX;
    newH = sy + sh - newY;
  } else if (corner === 'ne') {
    newY = Math.max(0, Math.min(sy + sh - 100, my));
    newW = Math.max(100, mx - sx);
    newH = sy + sh - newY;
  } else if (corner === 'sw') {
    newX = Math.max(0, Math.min(sx + sw - 100, mx));
    newW = sx + sw - newX;
    newH = Math.max(100, my - sy);
  } else if (corner === 'se') {
    newW = Math.max(100, mx - sx);
    newH = Math.max(100, my - sy);
  }

  h.x_permyriad = Math.round(Math.min(newX, 10000 - newW));
  h.y_permyriad = Math.round(Math.min(newY, 10000 - newH));
  h.width_permyriad = Math.round(Math.min(newW, 10000 - h.x_permyriad));
  h.height_permyriad = Math.round(Math.min(newH, 10000 - h.y_permyriad));
  renderHotspots();
  coordEl.textContent = '缩放: ' + Math.round(h.width_permyriad / 100) + '% × ' + Math.round(h.height_permyriad / 100) + '%';
});

document.addEventListener('pointerup', function() {
  if ((isDragging || isResizing) && preDragSnapshot) { pushHistory(preDragSnapshot); preDragSnapshot = null; }
  isDragging = false; isResizing = false; resizeCorner = null;
});

// Stage click → deselect
stage.addEventListener('click', function(e) {
  if (e.target === stage || e.target === img) { selectedHotspot = null; document.querySelectorAll('.editor-hotspot').forEach(function(el) { el.classList.remove('selected'); }); props.style.display = 'none'; coordEl.textContent = '坐标: -'; }
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }
  // 方向键微调选中热点：0.5% 步进（Shift=2.5% 大步），输入框聚焦时不拦截。
  // 连续按住只在首次推一次历史，避免 undo 栈被长按刷屏。
  var arrowDelta = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (arrowDelta && selectedHotspot != null && hotspots[selectedHotspot]) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    var step = (e.shiftKey ? 250 : 50);
    var now = Date.now();
    if (!e.repeat || now - lastNudgeAt > 600) pushHistory();
    lastNudgeAt = now;
    var nh = hotspots[selectedHotspot];
    nh.x_permyriad = Math.max(0, Math.min(10000 - nh.width_permyriad, nh.x_permyriad + arrowDelta[0] * step));
    nh.y_permyriad = Math.max(0, Math.min(10000 - nh.height_permyriad, nh.y_permyriad + arrowDelta[1] * step));
    renderHotspots();
    updatePropsPanel();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedHotspot != null && hotspots[selectedHotspot]) {
      if (e.target.tagName === 'INPUT') return; // not in input
      pushHistory();
      hotspots.splice(selectedHotspot, 1);
      selectedHotspot = null;
      props.style.display = 'none';
      renderHotspots();
      status('热点已删除 (Delete)', false);
    }
  }
  if (e.key === 'Escape') {
    selectedHotspot = null;
    document.querySelectorAll('.editor-hotspot').forEach(function(el) { el.classList.remove('selected'); });
    props.style.display = 'none';
    coordEl.textContent = '坐标: -';
  }
});

// Save — 防抖（保存中禁用）+ 加载态 + 成功强反馈（按钮短暂变 ✓）
$('saveBtn').onclick = async function() {
  var btn = $('saveBtn');
  if (btn.disabled) return; // 防抖：保存进行中忽略重复点击，避免重复提交
  var room = $('roomId').value.trim();
  if (!room) return status('请输入房间 ID', true);
  var dayUrl = $('dayUrl').value.trim();
  var nightUrl = $('nightUrl').value.trim();
  var actor = sceneActor();
  if (!actor || actor === '访客') return status('缺少已登录居民身份，不能保存场景', true);
  var payload = {
    room_id: room,
    actor: actor,
    image_layer: { layer_id: 'user-custom', preset: 'custom', asset_hint: 'custom', aspect_ratio_permyriad: 5625, owner_editable: true, day_image_url: dayUrl || null, night_image_url: nightUrl || null },
    hotspot_layer: hotspots.length ? { layer_id: 'user-hotspots', coordinate_system: 'scene-permyriad', owner_editable: true, hotspots: hotspots } : null
  };
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = '💾 保存中...';
  status('保存中...');
  try {
    var res = await api('/v1/shell/scene', 'POST', payload);
    if (res && res.error) {
      status('保存失败: ' + res.error, true);
    } else {
      status('✅ 已保存 (' + hotspots.length + ' 个热点)', false);
      btn.textContent = '✓ 已保存';
      setTimeout(function() { btn.textContent = orig; }, 1200);
      markClean(); // 保存成功，当前状态作为干净基线
    }
  } catch (e) {
    status('保存失败: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
};

$('resetBtn').onclick = function() { pushHistory(); hotspots = []; selectedHotspot = null; props.style.display = 'none'; renderHotspots(); status('已重置', false); };
$('previewBtn').onclick = function() {
  // 切换昼夜预览：每次点击在 day/night 背景间切换，让编辑者验证两个时段的热点对齐。
  var next = document.body.dataset.timeOfDay === 'night' ? 'day' : 'night';
  var url = (next === 'day' ? $('dayUrl').value.trim() : $('nightUrl').value.trim());
  if (!url) { status((next === 'day' ? '白天' : '夜晚') + '背景 URL 未填', true); return; }
  document.body.dataset.timeOfDay = next;
  img.src = url;
  img.style.display = 'block';
  status('预览 ' + (next === 'day' ? '白天' : '夜晚') + ' 背景', false);
};
$('zoomIn').onclick = function() { scale = Math.min(3, scale + 0.25); sceneCanvas.style.transform = 'scale(' + scale + ')'; };
$('zoomOut').onclick = function() { scale = Math.max(0.25, scale - 0.25); sceneCanvas.style.transform = 'scale(' + scale + ')'; };
$('fitBtn').onclick = function() { scale = 1; sceneCanvas.style.transform = 'scale(1)'; };
$('undoBtn').onclick = undo;
$('redoBtn').onclick = redo;

// Set default background from time of day
var hour = new Date().getHours();
document.body.dataset.timeOfDay = (hour >= 6 && hour < 18) ? 'day' : 'night';

// 若从 shell 跳转带了 room（+gateway），自动加载当前房间场景，省去手动点"加载"，
// 闭合 P1 编辑入口→编辑器的体验环（Bug A 修复后链接已带 activeRoomId + token）。
// realness 静态测试 URL 不带 room，不会触发此加载；gateway 不可达时 catch 给反馈，不抛异常。
if ($('roomId').value.trim() && $('gatewayUrl').value.trim()) {
  loadCurrentScene();
}
renderHotspotList(); // 渲染初始空列表（"暂无热点"提示 + 计数 0），让编辑者一进来就看到列表区
markClean(); // 初始基线：自动加载若成功会在其成功路径再次 markClean 更新为加载内容
</script>
</body>
