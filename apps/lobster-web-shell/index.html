    <script>
      (function() {
        const applyTimeOfDay = function() {
          const hour = new Date().getHours();
          if (document.body) {
            document.body.dataset.timeOfDay = (hour >= 6 && hour < 18) ? "day" : "night";
          }
        };
        if (document.body) {
          applyTimeOfDay();
        } else {
          document.addEventListener("DOMContentLoaded", applyTimeOfDay, { once: true });
        }
        // 从 URL 读取 device_id（MAC地址），填入注册表单隐藏字段
        document.addEventListener("DOMContentLoaded", function() {
          var deviceId = new URLSearchParams(window.location.search).get("device_id");
          if (deviceId) {
            var input = document.getElementById("auth-device-input");
            if (input) input.value = deviceId;
          }
        }, { once: true });
      })();
    </script>
  </head>
  <body
    data-shell-page="hub"
    data-shell-variant="public-square"
    data-default-shell-mode="hub"
    data-default-room-id="room:world:lobby"
    data-workspace="chat"
    data-sfc-theme="city"
    data-resident-login="enabled"
  >
    <div id="resident-login-overlay" class="resident-login-overlay shell-hidden" aria-hidden="true">
      <section id="resident-login-card" class="resident-login-card" aria-label="居民登录">
        <button type="button" id="resident-login-close" class="resident-login-close" aria-label="关闭登录窗口">×</button>
        <div class="resident-login-copy">
          <span class="resident-login-kicker">居民身份</span>
          <strong id="auth-status">登录状态：访客模式</strong>
        </div>
        <form id="auth-request-form" class="resident-login-form" data-auth-step="request">
          <label for="auth-email-input" class="resident-login-field-label">邮箱地址（也是你的注册ID）</label>
          <input id="auth-email-input" type="email" placeholder="输入邮箱地址" autocomplete="email" required />
          <label for="auth-nickname-input" class="resident-login-field-label">用户昵称</label>
          <input id="auth-nickname-input" type="text" placeholder="输入用户昵称" autocomplete="nickname" />
          <input id="auth-resident-input" type="hidden" autocomplete="off" />
          <input id="auth-device-input" type="hidden" autocomplete="off" />
          <input id="auth-delivery-select" type="hidden" value="email" />
          <button id="auth-request-button" type="submit">获取验证码</button>
        </form>
        <form id="auth-verify-form" class="resident-login-form resident-login-verify shell-hidden" data-auth-step="verify">
          <input id="auth-challenge-input" type="hidden" autocomplete="off" />
          <label for="auth-code-input" class="resident-login-field-label">邮箱验证码</label>
          <input id="auth-code-input" type="text" placeholder="输入邮箱验证码" autocomplete="one-time-code" />
          <button id="auth-verify-button" type="submit">完成登录</button>
        </form>
        <div id="auth-nickname-editor" class="resident-login-nickname shell-hidden">
          <span class="resident-login-hint">显示名称</span>
          <div class="resident-login-nickname-row">
            <input id="auth-nickname-edit-input" type="text" placeholder="设置显示名称" autocomplete="off" maxlength="32" />
            <button id="auth-nickname-save-btn" type="button">保存</button>
          </div>
        </div>
      </section>
    </div>

    <div class="app app-hub-shell sfc-shell sfc-city-shell city-hub-shell">
      <header class="sfc-hud public-square-hud">
        <div class="hud-left">
          <button class="hud-rail-toggle" id="hud-rail-toggle" aria-label="切换会话">≡</button>
          <div class="hub-hud-copy">
            <span class="hub-hud-kicker">Main City</span>
            <span class="hud-title">主城</span>
          </div>
        </div>
        <div class="hud-right">
          <button type="button" id="hud-login-toggle" class="hud-login-toggle shell-hidden" aria-label="打开登录窗口">登录</button>
          <span class="hub-hud-chip">群聊</span>
          <span id="hud-status" class="hud-pill">连线中</span>
        </div>
      </header>

      <main class="sfc-layout sfc-city-layout public-square-layout" aria-label="城邦公共聊天">
        <aside id="creative-rail" class="sfc-rail creative-rail public-square-rail" data-shell-column="rooms" aria-hidden="true">
          <div class="creative-rail-stack">
            <div class="rail-title">导航</div>
            <div class="rail-actions">
              <a href="./creative.html" class="rail-item">
                <span class="rail-label">住宅</span>
              </a>
              <a href="./index.html" class="rail-item is-active" aria-current="page">
                <span class="rail-label">主城</span>
              </a>
              <a href="./world-square.html" class="rail-item">
                <span class="rail-label">世界</span>
              </a>
              <a id="scene-editor-link" href="./scene-editor.html" class="rail-item rail-item--scene-editor" data-rail-visibility="owner-only" title="编辑房间场景">
                <span class="rail-label">🎨 场景</span>
              </a>
            </div>
          </div>
          <div class="creative-rail-divider">
            <span>居民</span>
            <input id="room-search-input" class="rail-search-input" type="text" placeholder="搜索居民或房间..." autocomplete="off" />
          </div>
          <ul id="resident-list" class="rail-list creative-resident-list"></ul>
          <ul id="room-list" class="rail-list creative-room-list"></ul>
        </aside>

        <section class="sfc-stage sfc-city-stage public-square-stage">
          <canvas
            id="room-stage-canvas"
            class="stage-canvas public-square-stage-canvas"
            aria-label="主城场景画布"
          ></canvas>
          <div class="scene-hotspot-label-layer public-square-hotspot-label-layer" aria-hidden="true"></div>

          <div class="scene-hotspots public-square-hotspots" aria-label="主城热点">
            <a
              href="./world-square.html"
              class="scene-hotspot scene-hotspot--metro"
              data-hotspot-title="地铁口"
              data-hotspot-copy="通过地铁站前往世界。"
            >
              <span>地铁口</span>
            </a>
            <button
              type="button"
              class="scene-hotspot scene-hotspot--plaza"
              data-hotspot-title="广场"
              data-hotspot-copy="查看当前群聊焦点和公共事件。"
            >
              <span>广场</span>
            </button>
            <button
              type="button"
              class="scene-hotspot scene-hotspot--board"
              data-hotspot-title="公告栏"
              data-hotspot-copy="打开公告、任务、相册墙和城邦提示。"
            >
              <span>公告栏</span>
            </button>
            <button
              type="button"
              class="scene-hotspot scene-hotspot--shop"
              data-hotspot-title="商铺"
              data-hotspot-copy="进入轻闲聊天、补给和附近居民动态。"
            >
              <span>商铺</span>
            </button>
          </div>

          <div class="sfc-chat-bar sfc-city-chat public-square-chat">
            <div id="timeline" class="chat-log public-square-log"></div>
          </div>

          <form id="composer" class="sfc-composer sfc-city-composer public-square-composer">
            <label class="public-square-field" for="composer-input">
              <button type="button" class="public-square-field-label public-square-mention-chip" data-mention-trigger>@用户名</button>
              <button
                type="button"
                class="composer-symbol-trigger"
                data-symbol-trigger
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="composer-symbol-menu"
              >
                颜
              </button>
              <button
                type="button"
                class="composer-attachment-trigger"
                data-attachment-trigger
                aria-label="发送图片"
              >
                图
              </button>
              <button
                type="button"
                class="composer-push-toggle"
                data-push-toggle
                hidden
                aria-pressed="false"
                title="开启消息推送通知"
              >
                铃
              </button>
              <input
                type="file"
                id="composer-attachment-input"
                accept="image/png,image/jpeg,image/gif,image/webp"
                hidden
              />
              <textarea
                id="composer-input"
                placeholder="在主城里说点什么…"
                rows="1"
              ></textarea>
            </label>

                  <button type="button" data-symbol-insert="&lt;(`^′)&gt;" role="menuitem">&lt;(`^′)&gt;</button>
                </div>

                <h3 class="composer-symbol-heading">震惊 / 尴尬</h3>

              <section class="composer-symbol-category" aria-label="无奈伤心颜文字">
                <h3 class="composer-symbol-heading">无奈 / 伤心</h3>
                <div class="composer-symbol-grid">
                  <button type="button" data-symbol-insert="╮(╯_╰)╭" role="menuitem">╮(╯_╰)╭</button>
                  <button type="button" data-symbol-insert=".....((/- -)/" role="menuitem">.....((/- -)/</button>

              <section class="composer-symbol-category" aria-label="亲亲动物颜文字">
                <h3 class="composer-symbol-heading">亲亲 / 动物 / Orz</h3>
                <div class="composer-symbol-grid">
                  <button type="button" data-symbol-insert="(* ￣3)(ε￣ *)" role="menuitem">(* ￣3)(ε￣ *)</button>
                  <button type="button" data-symbol-insert="(*￣3￣)╭" role="menuitem">(*￣3￣)╭</button>

                  <button type="button" data-symbol-insert="( ˘ ³˘)♥" role="menuitem">( ˘ ³˘)♥</button>
                  <button type="button" data-symbol-insert="( ¯(∞)¯ )" role="menuitem">( ¯(∞)¯ )</button>
                  <button type="button" data-symbol-insert="(:◎)≡" role="menuitem">(:◎)≡</button>

              <section class="composer-symbol-category" aria-label="轻萌颜文字">
                <h3 class="composer-symbol-heading">轻萌</h3>
                <div class="composer-symbol-grid">
                  <button type="button" data-symbol-insert="(✧∇✧)" role="menuitem">(✧∇✧)</button>
                  <button type="button" data-symbol-insert=">ㅂ<" role="menuitem">&gt;ㅂ&lt;</button>
                  <button type="button" data-symbol-insert="^O^" role="menuitem">^O^</button>
                  <button type="button" data-symbol-insert="(//▽//)" role="menuitem">(//▽//)</button>

                  <button type="button" data-symbol-insert="(ฅ´ω`ฅ)" role="menuitem">(ฅ´ω`ฅ)</button>

      </main>
